name: permprobe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe contents vs git-data api
        env:
          T: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "TOKLEN=${#T}"
          curl -s -o /tmp/repo.json -w 'REPO_HTTP=%{http_code}\n' -H "Authorization: Bearer $T" "https://api.github.com/repos/$GITHUB_REPOSITORY"
          python3 -c "import json;print('PERMS',json.load(open('/tmp/repo.json')).get('permissions'))"
          printf 'name: probecreated\non: workflow_dispatch\njobs:\n  x:\n    runs-on: ubuntu-latest\n    steps:\n      - run: echo created\n' > /tmp/wf.yml
          B64=$(base64 -w0 /tmp/wf.yml)
          H1=$(curl -s -o /tmp/c1.json -w '%{http_code}' -X PUT -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/.github/workflows/probe-created.yml" -d "{\"message\":\"probe contents api\",\"content\":\"$B64\",\"branch\":\"main\"}")
          echo "CONTENTS_API_HTTP=$H1"; head -c 400 /tmp/c1.json; echo
          HEAD_SHA=$(curl -s -H "Authorization: Bearer $T" "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | python3 -c 'import json,sys;print(json.load(sys.stdin)["object"]["sha"])')
          TREE_SHA=$(curl -s -H "Authorization: Bearer $T" "https://api.github.com/repos/$GITHUB_REPOSITORY/git/commits/$HEAD_SHA" | python3 -c 'import json,sys;print(json.load(sys.stdin)["tree"]["sha"])')
          BLOB_SHA=$(curl -s -X POST -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs" -d "{\"content\":\"$B64\",\"encoding\":\"base64\"}" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("sha","ERR"))')
          echo "HEAD=$HEAD_SHA TREE=$TREE_SHA BLOB=$BLOB_SHA"
          NEW_TREE=$(curl -s -X POST -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/git/trees" -d "{\"base_tree\":\"$TREE_SHA\",\"tree\":[{\"path\":\".github/workflows/probe-gitdata.yml\",\"mode\":\"100644\",\"type\":\"blob\",\"sha\":\"$BLOB_SHA\"}]}" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("sha","ERR"))')
          echo "NEW_TREE=$NEW_TREE"
          NEW_COMMIT=$(curl -s -X POST -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/git/commits" -d "{\"message\":\"probe gitdata\",\"tree\":\"$NEW_TREE\",\"parents\":[\"$HEAD_SHA\"]}" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get("sha","ERR"))')
          echo "NEW_COMMIT=$NEW_COMMIT"
          H2=$(curl -s -o /tmp/ref.json -w '%{http_code}' -X PATCH -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs/heads/main" -d "{\"sha\":\"$NEW_COMMIT\",\"force\":false}")
          echo "REF_UPDATE_HTTP=$H2"; head -c 400 /tmp/ref.json; echo
